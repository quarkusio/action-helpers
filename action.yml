name: 'Action helpers'
description: 'GitHub Actions helpers for the Quarkus project'
inputs:
  github-token:
    description: 'GitHub token'
    required: true
  action:
    description: 'Name of the action (if named)'
    required: false
  workflow-run-id:
    description: 'Workflow run id'
    required: false
  build-metadata-file-path:
    description: 'Path to the build-metadata.json file'
    required: false
  body:
    description: 'Body of the comment'
    required: false
  body-marker:
    description: 'Comment marker'
    required: false
  pr-number:
    description: 'The number of the pull request'
    required: false
runs:
  using: "composite"
  steps:
    - name: Run action
      uses: jbangdev/jbang-action@main
      with:
        script: io.quarkus.bot:action-helpers:999-SNAPSHOT
        jbangargs: "--repos 'github=https://x-access-token:${GITHUB_TOKEN}@maven.pkg.github.com/quarkusio/action-helpers/' --repos 'mavencentral'"
      env:
        JSON_INPUTS: ${{ toJSON(inputs) }}
        GITHUB_TOKEN: ${{ inputs.github-token }}